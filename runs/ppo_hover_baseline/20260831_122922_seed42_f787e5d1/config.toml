[experiment]
name = "ppo_hover_baseline"
seed = 42

[quadrotor]
mass = 1.0
arm_length = 0.2
inertia = [[0.01, 0.0, 0.0], [0.0, 0.01, 0.0], [0.0, 0.0, 0.02]]
yaw_torque_coefficient = 0.1
max_thrust = 5.0
gravity = 9.81
motor_spin_directions = [1.0, -1.0, 1.0, -1.0]

[simulation]
dt = 0.01
integrator = "rk4"

[dimensions]
observation_dim = 13
action_dim = 4

[environment]
target_position = [0.0, 0.0, 0.0]
target_heading = 0.0
episode_horizon = 10.0
max_position_error = 5.0
max_tilt_angle = 1.5707963267948966

[environment.success]
position_error = 0.1
speed = 0.25
angular_rate = 0.25
tilt_angle = 0.2617993877991494
heading_error = 0.2617993877991494

[environment.initializer]
name = "random"
min_position_distance = 0.0
max_position_distance = 0.25
min_velocity = 0.0
max_velocity = 0.25
min_tilt_angle = 0.0
max_tilt_angle = 0.2617993877991494
min_angular_velocity = 0.0
max_angular_velocity = 0.5

[reward]
alive_reward = 1.0
position_error_weight = 4.0
linear_velocity_weight = 0.1
tilt_weight = 0.1
heading_weight = 0.1
angular_velocity_weight = 0.1
thrust_deviation_weight = 0.1
terminal_penalty = 10.0
truncation_distance_scale = 0.25
cost_normalization_scale = 5.0
normalized_cost_limit = 0.9

[algorithm]
name = "ppo"

[ppo]
hidden_sizes = [64, 64]
initial_log_std = -1.5
min_log_std = -2.0
max_log_std = -1.0
gamma = 0.999
gae_lambda = 0.95
clip_epsilon = 0.2
learning_rate = 0.0003
value_loss_coef = 0.5
entropy_coef = 0.0
rollout_steps = 2048
steps_per_rollout = 4
normalize_observations = true
observation_clip = 10.0
normalize_advantages = true
normalization_epsilon = 1e-08
reward_scale = 0.1
max_grad_norm = 0.5

[tracking]
console_log_interval = 1
rerun_step_stride = 10
record_evaluation_rerun = false

[evaluation]
interval_updates = 10
episodes = 2
seed = 1042

[training]
updates = 1000
rolling_episode_window = 100
