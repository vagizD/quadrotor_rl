# Configuration for Task-Conditioned Move + Hover experiment.

[experiment]
name = "ppo_hover_and_move"
seed = 42

[quadrotor]
mass = 1.0
arm_length = 0.2
inertia = [
    [0.01, 0.0, 0.0],
    [0.0, 0.01, 0.0],
    [0.0, 0.0, 0.02],
]
yaw_torque_coefficient = 0.1
max_thrust = 5.0
gravity = 9.81
motor_spin_directions = [1.0, -1.0, 1.0, -1.0]

[simulation]
dt = 0.01
integrator = "rk4"

[dimensions]
observation_dim = 14
action_dim = 4

[environment]
target_position = [0.0, 0.0, 0.0]
target_heading = 0.0
episode_horizon = 10.0
max_position_error = 2.5
max_tilt_angle = 1.5707963267948966

[environment.success]
position_error = 0.10
speed = 0.25
angular_rate = 0.25
tilt_angle = 0.2617993877991494
heading_error = 0.2617993877991494

[environment.initializer]
name = "random"
min_position_distance = 0.0
max_position_distance = 2.5
min_velocity = 0.0
max_velocity = 0.5
min_tilt_angle = 0.0
max_tilt_angle = 0.2617993877991494
min_angular_velocity = 0.0
max_angular_velocity = 0.5

[reward]
alive_reward = 1.0
position_error_weight = 4.0
linear_velocity_weight = 0.5
tilt_weight = 0.1
heading_weight = 0.1
angular_velocity_weight = 0.1
thrust_deviation_weight = 0.1
terminal_penalty = 10.0
truncation_distance_scale = 0.25
cost_normalization_scale = 5.0
normalized_cost_limit = 0.9

# Configurable Dual-Mode Reward Parameters
hover_gate_distance_scale = 0.30
transit_allowed_tilt_z = 0.866  # 30 deg is allowed
hover_velocity_multiplier = 5.0
hover_angular_velocity_multiplier = 5.0
hover_thrust_asymmetry_weight = 5.0

[algorithm]
name = "ppo"

[tracking]
console_log_interval = 20
rerun_step_stride = 10
record_evaluation_rerun = false

[evaluation]
interval_updates = 50
episodes = 20
seed = 1042

[training]
updates = 3000
rolling_episode_window = 100

[ppo]
# Dual-Subnetwork Gated Policy Architecture
gated_dual_policy = true
hidden_sizes = [128, 128]
transit_hidden_sizes = [128, 128]

# Action noise std: initial=0.05 N (log_std=-3.0), min=0.018 N (log_std=-4.0), max=0.37 N (log_std=-1.0)
initial_log_std = -3.0
min_log_std = -4.0
max_log_std = -1.0
gamma = 0.999
gae_lambda = 0.95
clip_epsilon = 0.2
learning_rate = 0.0003
value_loss_coef = 0.5
entropy_coef = 0.0
rollout_steps = 2048
steps_per_rollout = 4
normalize_observations = false
observation_clip = 10.0
normalize_advantages = true
normalization_epsilon = 1e-8
reward_scale = 0.1
max_grad_norm = 0.5
