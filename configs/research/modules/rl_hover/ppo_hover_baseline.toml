# Complete baseline experiment configuration.

[experiment]
name = "ppo_hover_baseline"
seed = 42

[quadrotor]
mass = 1.0
arm_length = 0.2
inertia = [
    [0.01, 0.0, 0.0],
    [0.0, 0.01, 0.0],
    [0.0, 0.0, 0.02],
]
yaw_torque_coefficient = 0.1
max_thrust = 5.0
gravity = 9.81
motor_spin_directions = [1.0, -1.0, 1.0, -1.0]

[simulation]
dt = 0.01
integrator = "rk4"

[dimensions]
observation_dim = 14
action_dim = 4

[environment]
target_position = [0.0, 0.0, 0.0]
# Desired body-forward heading in the world horizontal plane, in radians.
target_heading = 0.0
episode_horizon = 10.0
# Position and tilt define the physical recoverability region.
max_position_error = 5.0
max_tilt_angle = 1.5707963267948966

[environment.success]
position_error = 0.10
speed = 0.25
angular_rate = 0.25
tilt_angle = 0.2617993877991494
heading_error = 0.2617993877991494

[environment.initializer]
name = "random"
min_position_distance = 0.0
max_position_distance = 0.25
min_velocity = 0.0
max_velocity = 0.25
min_tilt_angle = 0.0
max_tilt_angle = 0.2617993877991494
min_angular_velocity = 0.0
max_angular_velocity = 0.5

[reward]
# Fixed per-step survival component; failure is penalized separately.
alive_reward = 1.0
# Position is the primary objective; it appears once in the raw cost.
position_error_weight = 4.0
linear_velocity_weight = 0.1
tilt_weight = 0.1
heading_weight = 0.1
angular_velocity_weight = 0.1
# Make large deviations from symmetric hover thrust materially costly.
thrust_deviation_weight = 0.1
# Use one terminal scale for physical failure and distance-dependent horizon
# completion. The current scale is intentionally moderate for training.
terminal_penalty = 10.0
truncation_distance_scale = 0.25
# The observed raw cost is typically around 4-5; this scale gives it a smooth
# bounded contribution without a hard plateau at the configured upper limit.
cost_normalization_scale = 5.0
normalized_cost_limit = 0.9

[algorithm]
name = "ppo"

[tracking]
console_log_interval = 1
# Log every tenth transition when a selected RL episode is sent to Rerun.
rerun_step_stride = 10
# Requires the visualization extra; false keeps training headless.
record_evaluation_rerun = false

[evaluation]
interval_updates = 10
episodes = 2
seed = 1042

[training]
updates = 1000
rolling_episode_window = 100

[ppo]
hidden_sizes = [64, 64]
initial_log_std = -1.5
# Bound the learned pre-squash exploration standard deviation to exp([-2, -1]).
min_log_std = -2.0
max_log_std = -1.0
# With dt=0.01, this gives an approximately 10-second e-folding discount horizon.
gamma = 0.999
gae_lambda = 0.95
# PPO trust-region range and full-batch optimizer settings.
clip_epsilon = 0.2
learning_rate = 0.0003
value_loss_coef = 0.5
entropy_coef = 0.0
rollout_steps = 2048
# Reuse each rollout for multiple PPO optimizer passes.
steps_per_rollout = 4
# Normalize policy/critic inputs with running rollout statistics.
normalize_observations = true
observation_clip = 10.0
# Normalize the batch-wide GAE targets used by the actor.
normalize_advantages = true
normalization_epsilon = 1e-8
# Scale rewards only when constructing return and GAE targets.
reward_scale = 0.1
# Clip actor and critic gradient norms independently.
max_grad_norm = 0.5
